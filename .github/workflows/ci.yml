name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    uses: folke/github/.github/workflows/ci.yml@main
    secrets: inherit
    with:
      plugin: lazy.nvim
      repo: cicd-oracle-sandbox/folke__lazy.nvim
      docs: false
