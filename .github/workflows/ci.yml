name: CI

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

jobs:
  ci:
    permissions:
      contents: read  # for actions/checkout to fetch code
      pull-requests: read  # for folke/github/neovim to fetch pull requests
    uses: folke/github/.github/workflows/ci.yml@main
    secrets: inherit
    with:
      plugin: lazy.nvim
      repo: cicd-oracle-sandbox/folke__lazy.nvim
      docs: false
