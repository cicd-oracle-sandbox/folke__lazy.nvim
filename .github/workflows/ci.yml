name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  ci:
    uses: folke/github/.github/workflows/ci.yml@main
    permissions:
      contents: read
      statuses: write
      checks: write
    with:
      plugin: lazy.nvim
      repo: cicd-oracle-sandbox/folke__lazy.nvim
      docs: false
